# GitHub Pages serves this repository's root, so every tracked Markdown file at
# the root is fetchable from the live site. That included README.md, which
# documents the Parent Tools reset code -- one URL away on the same iPad the
# code is supposed to be absent from. These are notes for Kevin and for Claude,
# never for the app, so Pages does not publish them.
exclude:
  - README.md
  - CLAUDE.md
  - COUNCIL-REPORT.md
  - ROADMAP.md
  - CHANGELOG.md
  - forum
  - test
  - tools
  # v19.13: these were still served. The status page named the boys; the rest
  # are notes and tooling, never the app. docs/forum.html stays published on
  # purpose -- it is Kevin's live dashboard (see tools/forum-dashboard.mjs).
  - docs/project-status.html
  - docs/forum-artifact.html
  - ROADMAP-v19.md
  - ROADMAP-v20.md
  - CODESPACES.md
  - SECURITY.md
  - package.json
  - package-lock.json
  - LICENSE
  - node_modules
  - "*.html.bak"
  - "session-report-*.html"
  - next/ARCHITECTURE.md
  - next/test
